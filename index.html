<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英语教学工作台</title>
<style>
/* ============================================================
   英语教学工作台 · 浅色 SaaS 主题
   ============================================================ */
:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --primary:#2563eb;
  --primary-d:#1d4ed8;
  --primary-soft:#e8f0ff;
  --cyan:#06b6d4;
  --cyan-soft:#e0f7fb;
  --text:#1e293b;
  --text-2:#475569;
  --muted:#7c8798;
  --line:#e6ecf5;
  --line-2:#eef2f8;
  --ok:#16a34a;      --ok-soft:#e7f7ee;
  --warn:#f97316;    --warn-soft:#fff1e6;
  --danger:#ef4444;  --danger-soft:#fdecec;
  --leave:#94a3b8;   --leave-soft:#eef2f7;
  --purple:#7c3aed;  --purple-soft:#f1e9ff;
  --amber:#d97706;   --amber-soft:#fff7e6;
  --radius:14px;
  --radius-s:10px;
  --shadow:0 2px 10px rgba(15,23,42,.06);
  --shadow-2:0 8px 28px rgba(15,23,42,.12);
  --sidebar-w:240px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d5dde9;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.small{font-size:12px}
.muted{color:var(--muted)}
.center{text-align:center}
.right{text-align:right}
.nowrap{white-space:nowrap}
.hide{display:none !important}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row-b{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grow{flex:1}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}

.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:#fff;border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;
  display:flex;flex-direction:column;z-index:60;
}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 12px;border-bottom:1px solid var(--line-2)}
.brand-logo{
  width:34px;height:34px;border-radius:10px;flex:0 0 34px;
  background:linear-gradient(135deg,var(--primary),var(--cyan));
  color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;
}
.brand-txt{display:flex;flex-direction:column;line-height:1.25}
.brand-txt strong{font-size:14px}
.brand-txt span{font-size:11px;color:var(--muted);letter-spacing:.3px}

.me{display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--primary-soft);margin:12px;border-radius:var(--radius)}
.avatar{
  width:40px;height:40px;border-radius:50%;flex:0 0 40px;
  background:linear-gradient(135deg,var(--primary),#60a5fa);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;
}
.me-txt{line-height:1.35;min-width:0}
.me-name{font-weight:600}
.me-sub{font-size:12px;color:var(--text-2)}

.nav{flex:1;overflow:auto;padding:4px 10px 10px}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:var(--radius-s);
  color:var(--text-2);font-size:13.5px;margin-bottom:2px;cursor:pointer;
  transition:background .15s,color .15s;
}
.nav-item:hover{background:var(--line-2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary-d);font-weight:600}
.nav-item .ni{width:20px;text-align:center;font-size:15px}
.nav-item .nt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{
  min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--danger);color:#fff;font-size:11px;font-weight:600;
  display:none;align-items:center;justify-content:center;line-height:18px;
}
.badge.show{display:inline-flex}
.side-foot{padding:10px 16px 14px;border-top:1px solid var(--line-2)}
.side-tip{font-size:11.5px;color:var(--muted);text-align:center}

.sidebar-mask{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:55}

.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 22px;
}
.tb-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tb-sub{padding-top:2px}
.crumb{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600}
.crumb-home{font-size:14px;opacity:.5}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-label{font-size:12px;color:var(--muted)}
.greet{font-size:15px;font-weight:600}
.dt{font-size:12.5px;color:var(--muted)}
.chip-soft{
  font-size:11.5px;color:var(--primary-d);background:var(--primary-soft);
  padding:2px 9px;border-radius:20px;
}

.hamburger{
  display:none;width:34px;height:34px;border:1px solid var(--line);background:#fff;
  border-radius:9px;font-size:16px;color:var(--text);
}

.icon-btn{
  width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;
  color:var(--text-2);font-size:14px;display:inline-flex;align-items:center;justify-content:center;
  transition:.15s;
}
.icon-btn:hover{background:var(--primary-soft);border-color:#c7dbff;color:var(--primary-d)}

/* 自动保存状态提示 */
.save-status{
  font-size:12px;line-height:1;color:#16a34a;white-space:nowrap;margin-left:4px;
  opacity:0;transform:translateY(-2px);transition:opacity .3s,transform .3s;
  display:inline-flex;align-items:center;gap:4px;
}
.save-status::before{content:"";width:7px;height:7px;border-radius:50%;background:#16a34a;display:inline-block;box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.save-status.show{opacity:1;transform:translateY(0)}
@media (max-width:760px){
  .save-status{font-size:11px;margin-left:2px}
}

/* 云端登录按钮 */
.cloud-btn{
  font-size:12px;line-height:1;white-space:nowrap;cursor:pointer;user-select:none;
  padding:6px 10px;border-radius:999px;border:1px solid #c7dbff;color:var(--primary-d);
  background:#eef4ff;display:inline-flex;align-items:center;gap:4px;transition:background .2s,border-color .2s;
}
.cloud-btn:hover{background:#e2ecff;border-color:#a9c8ff}
.cloud-btn.off{color:var(--primary-d)}
.cloud-btn.on{color:#0f7a3d;background:#e8f7ee;border-color:#bde9cc}
.cloud-btn.syncing{color:#9a6b00;background:#fff5e0;border-color:#ffe0a3}
.cloud-btn.err{color:var(--danger);background:var(--danger-soft);border-color:#f0b4b4}
@media (max-width:760px){ .cloud-btn{font-size:11px;padding:5px 8px} }

/* 登录弹窗 */
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{
  flex:1;padding:8px 10px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--muted);
  cursor:pointer;font-size:14px;transition:all .2s;
}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text)}
.login-msg{font-size:13px;min-height:16px;color:var(--muted)}
.login-msg.err{color:var(--danger)}
.login-msg.ok{color:var(--ok)}

.sel,.inp,.ta{
  border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;outline:none;
  transition:border-color .15s,box-shadow .15s;max-width:100%;
}
.sel:focus,.inp:focus,.ta:focus{border-color:#93b8ff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.ta{width:100%;resize:vertical;min-height:80px;line-height:1.6}
.inp.w100,.sel.w100{width:100%}

/* ============ 内容区 ============ */
.content{padding:18px 22px 60px;flex:1;min-width:0}
.view{display:none;animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px;margin-bottom:16px;
}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:600;flex:1;min-width:120px}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:400}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
.g-3-2{grid-template-columns:3fr 2fr}

/* KPI */
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:12px;align-items:center;
}
.kpi-ico{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.kpi-v{font-size:22px;font-weight:700;line-height:1.2}
.kpi-l{font-size:12.5px;color:var(--muted)}
.kpi-d{font-size:11.5px;margin-top:2px}

/* 按钮 */
.btn{
  border:1px solid var(--line);background:#fff;color:var(--text-2);
  padding:7px 14px;border-radius:9px;font-size:13.5px;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:#c7dbff;color:var(--primary-d);background:var(--primary-soft)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d);border-color:var(--primary-d);color:#fff}
.btn-ghost{background:transparent}
.btn-danger{color:var(--danger);border-color:#f6cfcf}
.btn-danger:hover{background:var(--danger-soft);border-color:#f0b4b4;color:var(--danger)}
.btn-sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* 标签 / chip */
.tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--line-2);color:var(--text-2);
  white-space:nowrap;
}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.tag.leave{background:var(--leave-soft);color:var(--leave)}
.tag.info{background:var(--primary-soft);color:var(--primary-d)}
.tag.purple{background:var(--purple-soft);color:var(--purple)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.cyan{background:var(--cyan-soft);color:#0e8fa8}

.chip{
  border:1px solid var(--line);background:#fff;border-radius:20px;
  padding:5px 12px;font-size:12.5px;color:var(--text-2);cursor:pointer;transition:.15s;
}
.chip:hover{border-color:#93b8ff;color:var(--primary-d);background:var(--primary-soft)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

.seg{display:inline-flex;background:var(--line-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{
  border:none;background:transparent;padding:5px 12px;border-radius:8px;
  font-size:12.5px;color:var(--text-2);
}
.seg button.active{background:#fff;color:var(--primary-d);font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.08)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{
  border:none;background:transparent;padding:8px 14px;font-size:13.5px;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
.tabs button.active{color:var(--primary-d);font-weight:600;border-bottom-color:var(--primary)}

/* 表格 */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-s)}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
table.tb th{
  background:#f8fafc;text-align:left;padding:10px 12px;font-weight:600;
  color:var(--text-2);font-size:12.5px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tb td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tb tr:last-child td{border-bottom:none}
table.tb tbody tr:hover{background:#fafbfe}

/* 列表项 */
.list-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);
  border-radius:var(--radius-s);margin-bottom:10px;background:#fff;transition:.15s;
}
.list-item:hover{border-color:#c7dbff;box-shadow:var(--shadow)}
.li-ico{
  width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:17px;
}
.li-main{flex:1;min-width:0}
.li-t{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.li-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.li-act{display:flex;gap:6px;align-items:center}

.empty{padding:36px 12px;text-align:center;color:var(--muted);font-size:13px}

/* 进度条 */
.bar{height:7px;border-radius:6px;background:var(--line-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--primary)}
.bar.ok > i{background:var(--ok)}
.bar.warn > i{background:var(--warn)}

/* 表单 */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12.5px;color:var(--text-2);font-weight:500}
.fld .hint{font-size:11.5px;color:var(--muted)}
.fld.full{grid-column:1/-1}

/* 弹窗 */
.modal-mask{
  position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:200;
  display:none;align-items:center;justify-content:center;padding:18px;
}
.modal-mask.show{display:flex}
.modal{
  background:#fff;border-radius:16px;box-shadow:var(--shadow-2);
  width:min(720px,100%);max-height:88vh;display:flex;flex-direction:column;
  animation:pop .18s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{flex:1;font-size:16px}
.modal-body{padding:16px 18px;overflow:auto;flex:1}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal-foot:empty{display:none}

/* toast */
.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:rgba(30,41,59,.94);color:#fff;padding:9px 18px;border-radius:22px;font-size:13px;
  box-shadow:var(--shadow-2);animation:tin .2s ease;
}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ============ 课表 ============ */
.tt-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table.tt{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}
table.tt th{
  background:#f8fafc;padding:8px 6px;border:1px solid var(--line-2);
  font-weight:600;color:var(--text-2);font-size:12px;
}
table.tt th.today{background:var(--primary-soft);color:var(--primary-d)}
table.tt td.tt-time{
  background:#f8fafc;border:1px solid var(--line-2);padding:6px;white-space:nowrap;
  text-align:center;color:var(--text-2);font-size:11.5px;line-height:1.35;width:78px;
}
table.tt td.tt-time b{display:block;color:var(--text);font-size:12.5px}
table.tt td.tt-slot{border:1px solid var(--line-2);padding:4px;height:56px;vertical-align:top;cursor:pointer;transition:.12s}
table.tt td.tt-slot:hover{box-shadow:inset 0 0 0 2px #93b8ff}
table.tt td.tt-slot.today-col{background:#fbfcff}
.cell{
  border-radius:8px;padding:5px 6px;height:100%;min-height:46px;font-size:11.5px;line-height:1.35;
  display:flex;flex-direction:column;gap:1px;overflow:hidden;
}
.cell .c-cls{font-weight:600;font-size:11.5px}
.cell .c-t{p color:var(--text-2)}
.cell .c-t{font-size:11px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .c-r{font-size:10.5px;color:var(--muted)}
.cell.t-early{background:#fff7e6;border-left:3px solid var(--amber)}
.cell.t-noon{background:#e0f7fb;border-left:3px solid var(--cyan)}
.cell.t-class{background:var(--primary-soft);border-left:3px solid var(--primary)}
.cell.t-svc{background:#f1e9ff;border-left:3px solid var(--purple)}
.cell.t-meet{background:var(--danger-soft);border-left:3px solid var(--danger)}
.cell.t-free{background:#fff;border:1px dashed #dbe3ee;align-items:center;justify-content:center;color:#c3ccda}

/* 作文 / 批注 */
.essay{
  background:#fbfcfe;border:1px solid var(--line);border-radius:var(--radius-s);
  padding:14px;line-height:2.1;font-size:14.5px;
}
u.err{
  text-decoration:none;border-bottom:2px wavy var(--danger);
  color:var(--danger);cursor:pointer;background:var(--danger-soft);padding:0 2px;border-radius:3px;
}
u.err:hover{background:#fbdada}
u.err.g{color:var(--warn);background:var(--warn-soft);border-bottom-color:var(--warn)}
.dict{cursor:pointer}

/* 词典面板 */
.dict-fab{
  position:fixed;right:20px;bottom:20px;width:52px;height:52px;border-radius:50%;
  border:none;background:linear-gradient(135deg,var(--primary),var(--cyan));color:#fff;font-size:22px;
  box-shadow:0 6px 20px rgba(37,99,235,.35);z-index:150;
}
.dict-panel{
  position:fixed;right:20px;bottom:84px;width:330px;max-width:calc(100vw - 32px);
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-2);z-index:151;display:none;overflow:hidden;
}
.dict-panel.show{display:block;animation:pop .18s ease}
.dp-head{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-2);background:var(--primary-soft)}
.dp-head strong{flex:1;font-size:14px}
.dp-search{display:flex;gap:6px;padding:10px 12px}
.dp-search .inp{flex:1}
.dp-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px;max-height:76px;overflow:auto}
.dp-chips .chip{padding:3px 9px;font-size:11.5px}
.dp-body{padding:12px;max-height:44vh;overflow:auto;border-top:1px solid var(--line-2)}
.dp-word{font-size:18px;font-weight:700}
.dp-ph{color:var(--muted);font-size:13px;margin-left:6px}
.dp-line{margin-top:6px;font-size:13px}
.dp-pos{display:inline-block;background:var(--line-2);border-radius:5px;padding:0 6px;font-size:11.5px;color:var(--text-2);margin-right:6px}
.dp-ex{background:#f8fafc;border-left:3px solid var(--primary);padding:7px 10px;border-radius:0 8px 8px 0;margin-top:8px;font-size:12.5px}
.dp-links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* 聊天 */
.chat-wrap{display:grid;grid-template-columns:1fr 300px;gap:14px}
.chat{display:flex;flex-direction:column;height:min(60vh,520px);min-height:380px}
.chat-body{flex:1;overflow:auto;padding:12px;background:#f8fafc;border-radius:var(--radius-s);border:1px solid var(--line)}
.msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.msg .bubble{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;
  max-width:80%;font-size:13.5px;white-space:pre-wrap;box-shadow:var(--shadow);
}
.msg.me .bubble{background:var(--primary);border-color:var(--primary);color:#fff}
.msg.wide .bubble{max-width:100%;padding:10px 12px}
.msg .who{font-size:11px;color:var(--muted);margin-bottom:3px}
.chat-in{display:flex;gap:8px;margin-top:10px}
.chat-in .inp{flex:1}
.typing{color:var(--muted);font-size:12.5px}

/* 便签 */
.note{
  border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:var(--radius-s);
  padding:12px;background:#fff;margin-bottom:10px;
}
.note.wx{border-left-color:var(--ok)}
.note.tel{border-left-color:var(--amber)}
.note.home{border-left-color:var(--purple)}
.note.face{border-left-color:var(--cyan)}
.note-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.note-h b{font-size:13.5px}
.note-t{font-size:12px;color:var(--muted)}
.note-c{font-size:13.5px;color:var(--text-2);white-space:pre-wrap}
.note-imgs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.note-imgs img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.note-imgs .ph{width:74px;height:74px;border-radius:8px;background:var(--line-2);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted)}

/* 通讯录 */
.contact{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--radius-s);margin-bottom:8px;background:#fff;
}
.contact .c-av{width:34px;height:34px;border-radius:50%;background:var(--cyan-soft);color:#0e8fa8;display:flex;align-items:center;justify-content:center;font-weight:600;flex:0 0 34px}

/* 会话 */
.sess{
  display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--radius-s);
  cursor:pointer;border:1px solid transparent;
}
.sess:hover{background:#f8fafc}
.sess.active{background:var(--primary-soft);border-color:#c7dbff}
.sess .s-av{width:36px;height:36px;border-radius:50%;background:var(--primary-soft);color:var(--primary-d);display:flex;align-items:center;justify-content:center;font-weight:600;flex:0 0 36px}
.sess .s-n{font-weight:600;font-size:13.5px}
.sess .s-m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:0 0 8px}
.sess-del{flex:0 0 auto;margin-left:6px;width:30px;height:30px;font-size:13px;opacity:.6}
.sess-del:hover{opacity:1;background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.msg{position:relative}
.msg-del{position:absolute;top:-7px;right:-7px;width:22px;height:22px;font-size:11px;padding:0;opacity:.5;border-radius:50%}
.msg.me .msg-del{right:auto;left:-7px}
.msg-del:hover{opacity:1;background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}

/* 开关 & 滑块 */
.switch{position:relative;width:44px;height:24px;flex:0 0 44px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;background:#d5dde9;border-radius:24px;transition:.18s}
.switch i::after{
  content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.switch input:checked + i{background:var(--primary)}
.switch input:checked + i::after{transform:translateX(20px)}
.pref{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.pref:last-child{border-bottom:none}
.pref .p-t{flex:1;min-width:0}
.pref .p-t b{font-size:13.5px;font-weight:600;display:block}
.pref .p-t span{font-size:12px;color:var(--muted)}
input[type=range]{width:190px;accent-color:var(--primary)}

/* 资源库 */
.res-block{border:1px solid var(--line);border-radius:var(--radius-s);margin-bottom:12px;overflow:hidden}
.res-h{background:#f8fafc;padding:9px 13px;font-weight:600;font-size:13.5px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
.res-b{padding:12px 14px;font-size:13.5px;line-height:1.85}
.res-b ol,.res-b ul{margin:4px 0;padding-left:20px}
.res-b li{margin:2px 0}
.res-b .lv{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;margin-right:6px;font-weight:600}
.lv-b{background:var(--ok-soft);color:var(--ok)}
.lv-m{background:var(--primary-soft);color:var(--primary-d)}
.lv-h{background:var(--purple-soft);color:var(--purple)}
.res-b table.mini{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.res-b table.mini th,.res-b table.mini td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.res-b table.mini th{background:#f8fafc}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;font-size:13px}

/* 图例 */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* 打印 */
@media print{
  .sidebar,.topbar,.dict-fab,.dict-panel,.modal-mask,.toast-wrap{display:none !important}
  .content{padding:0}
  .card{box-shadow:none;break-inside:avoid}
}

/* ============ 响应式 ============ */
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3-2{grid-template-columns:1fr}
  .chat-wrap{grid-template-columns:1fr}
}
@media (max-width:760px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;height:100%;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-2);
  }
  .sidebar.open{transform:none}
  .sidebar-mask.show{display:block}
  .hamburger{display:inline-flex}
  .content{padding:14px 12px 70px}
  .topbar{padding:9px 12px}
  .crumb{font-size:15px}
  .tb-right{width:100%;margin-left:0}
  .g2,.g3,.g4,.g-2-1,.g-1-2,.g-3-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .modal{width:100%;max-height:92vh}
  .modal-foot{justify-content:stretch}
  .modal-foot .btn{flex:1}
  .dict-panel{right:12px;left:12px;width:auto;bottom:76px}
  .dict-fab{right:14px;bottom:14px}
  table.tb{min-width:560px}
  .kpi-v{font-size:19px}
}

/* ============ 手机端细节优化（≤480px） ============ */
@media (max-width:480px){
  body{font-size:15px}
  .content{padding:12px 10px 84px}
  .topbar{padding:8px 10px}
  .tb-row{gap:8px}
  .crumb{font-size:14px}
  .greet{font-size:15px}
  .card{padding:12px;border-radius:12px;margin-bottom:12px}
  .grid{gap:10px}
  .kpi{padding:12px}
  .kpi-ico{width:38px;height:38px;flex:0 0 38px;font-size:17px}
  .kpi-v{font-size:18px}
  .btn{padding:8px 12px;min-height:36px;font-size:13.5px}
  .btn-sm{min-height:32px}
  .icon-btn{width:36px;height:36px}
  .sel,.inp,.ta{padding:8px 10px;font-size:15px}
  .tabs button{padding:8px 10px;font-size:13px}
  .seg button{padding:6px 10px;font-size:12.5px}
  .modal-head,.modal-body,.modal-foot{padding-left:12px;padding-right:12px}
  .modal{border-radius:14px}
  .dict-fab{width:48px;height:48px;font-size:20px;right:12px;bottom:12px}
  .dict-panel{right:8px;left:8px;width:auto;bottom:68px}
  .nav-item{padding:11px 12px;font-size:14px}
  .avatar{width:44px;height:44px;flex:0 0 44px;font-size:17px}
  table.tb{font-size:13px}
  table.tb th,table.tb td{padding:9px 10px}
  .res-b{font-size:13.5px;padding:10px 11px}
  .essay{padding:11px;font-size:15px;line-height:2.2}
  .toast{font-size:13.5px;max-width:88vw;text-align:center}
}
@media (hover:none){
  .nav-item:active,.sess:active,.list-item:active{background:var(--primary-soft)}
  .btn:active{transform:scale(.98)}
}

/* 首页「工作待办」清单 */
.todo-row{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;transition:.15s}
.todo-row:hover{border-color:#c7dbff;box-shadow:var(--shadow)}
.todo-row.done{background:#f8fafc}
.todo-check{
  width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:1.5px solid #cbd5e1;background:#fff;
  color:#fff;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;
}
.todo-check:hover{border-color:var(--primary)}
.todo-check.on{background:var(--ok);border-color:var(--ok)}
.todo-dot{width:10px;height:10px;flex:0 0 10px;border-radius:50%}
.todo-text{
  flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;
  padding:4px 6px;font-size:14px;color:var(--text);transition:.15s;
}
.todo-text:hover{border-color:var(--line-2)}
.todo-text:focus{outline:none;border-color:#93b8ff;box-shadow:0 0 0 3px rgba(37,99,235,.1);background:#fff}
.todo-text.done{text-decoration:line-through;color:var(--muted)}
.todo-del{color:var(--muted);border-color:transparent;font-size:12px;padding:3px 8px}
.todo-del:hover{color:var(--danger);background:var(--danger-soft);border-color:#f0b4b4}
.todo-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line-2)}

/* 智能批改 — AI 订正建议 */
.corr{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line-2);font-size:14px;line-height:1.6}
.corr:last-child{border-bottom:none}
.corr-w{color:var(--danger);text-decoration:line-through;text-decoration-color:#f0a3a3}
.corr-r{color:var(--ok);font-weight:600}
.todo-add .inp{flex:1;min-width:140px}
.swatch-row{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2);cursor:pointer;padding:0;transition:.15s}
.swatch:hover{transform:scale(1.12)}
.swatch.active{box-shadow:0 0 0 2px var(--primary)}

/* 智能批改 — 批量上传清单 */
.batch-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto}
.batch-row{display:flex;align-items:center;gap:10px;background:var(--card-2);border:1px solid var(--line-2);border-radius:10px;padding:7px 10px}
.batch-idx{flex:0 0 22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:12px}
.batch-name{flex:1;font-weight:600}
